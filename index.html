const ST={draft:['Draft','#6b7a88'],diajukan:['Diajukan','#3b74ab'],review:['Direview','#b7791f'],dikembalikan:['Dikembalikan','#a4342a'],kontrak:['Kontrak','#2a7f62'],pelaksanaan:['Pelaksanaan','#2a5a8c'],laporan:['Laporan','#6b46c1'],diseminasi:['Diseminasi','#6b46c1'],luaran:['Luaran','#2a7f62'],selesai:['Selesai','#1e7e34']};

const TABLES=['users','proposal','anggota','review','termin','opsi'];
const SCHEMA_SQL=`-- Kompatibel SQLite / Cloudflare D1. Jalankan: wrangler d1 execute <DB> --file=schema.sql
CREATE TABLE IF NOT EXISTS users(id TEXT PRIMARY KEY,username TEXT UNIQUE NOT NULL,password TEXT NOT NULL /* DEMO plaintext: ganti hash di D1 */,nama TEXT,role TEXT CHECK(role IN('dosen','reviewer','admin')),email TEXT,hp TEXT,nidn TEXT,sinta TEXT,pend TEXT,jab TEXT,prodi TEXT,aktif INTEGER DEFAULT 1);
CREATE TABLE IF NOT EXISTS proposal(id TEXT PRIMARY KEY,skema TEXT NOT NULL,judul TEXT NOT NULL,tahun INTEGER,semester TEXT,ketua_id TEXT REFERENCES users(id),status TEXT DEFAULT 'draft',mitra TEXT,jml_mahasiswa INTEGER,anggaran REAL,isi TEXT /* JSON: ketua, ringkasan, bab, rab, jadwal, referensi */,created_at TEXT,updated_at TEXT);
CREATE TABLE IF NOT EXISTS anggota(id TEXT PRIMARY KEY,proposal_id TEXT REFERENCES proposal(id) ON DELETE CASCADE,nama TEXT,sinta TEXT,prodi TEXT,tugas TEXT,jenis TEXT DEFAULT 'dosen' CHECK(jenis IN('dosen','non')),user_id TEXT REFERENCES users(id) /* terisi jika dosen terdaftar */,status TEXT /* menunggu|setuju|tolak (dosen), kosong (non-dosen) */,alasan TEXT,tanggal TEXT);
CREATE TABLE IF NOT EXISTS review(id TEXT PRIMARY KEY,proposal_id TEXT REFERENCES proposal(id) ON DELETE CASCADE,reviewer_id TEXT,skor REAL,rekomendasi TEXT,catatan TEXT,created_at TEXT);
CREATE TABLE IF NOT EXISTS termin(id TEXT PRIMARY KEY,proposal_id TEXT REFERENCES proposal(id) ON DELETE CASCADE,termin INTEGER,persen REAL,jumlah REAL,status TEXT DEFAULT 'menunggu',tanggal TEXT);
CREATE TABLE IF NOT EXISTS opsi(id TEXT PRIMARY KEY,kategori TEXT NOT NULL,nilai TEXT NOT NULL,urut INTEGER DEFAULT 0,aktif INTEGER DEFAULT 1,UNIQUE(kategori,nilai));
CREATE INDEX IF NOT EXISTS ix_prop_ketua ON proposal(ketua_id);CREATE INDEX IF NOT EXISTS ix_ang_prop ON anggota(proposal_id);CREATE INDEX IF NOT EXISTS ix_ang_user ON anggota(user_id);`;
/* Antarmuka adapter: open() all(t) put(t,row) del(t,id). Ganti `const DB=IDB` -> `D1` saat siap. */
const IDB={db:null,
 open(){return new Promise((ok,no)=>{const r=indexedDB.open('ppm_lppm',2);r.onupgradeneeded=()=>TABLES.forEach(t=>{if(!r.result.objectStoreNames.contains(t))r.result.createObjectStore(t,{keyPath:'id'})});r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>no(r.error)})},
 tx(t,m,f){return new Promise((ok,no)=>{const q=f(this.db.transaction(t,m).objectStore(t));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
 all(t){return this.tx(t,'readonly',s=>s.getAll())},put(t,r){return this.tx(t,'readwrite',s=>s.put(r))},del(t,id){return this.tx(t,'readwrite',s=>s.delete(id))},
 reset(){return new Promise(ok=>{this.db.close();const r=indexedDB.deleteDatabase('ppm_lppm');r.onsuccess=r.onerror=r.onblocked=ok})}};

 async put(t,r){await fetch(`${this.base}/${t}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(r)})},
 async del(t,id){await fetch(`${this.base}/${t}/${id}`,{method:'DELETE'})}};

const rm=async(t,id)=>{await DB.del(t,id);C[t]=C[t].filter(x=>x.id!==id)};
async function seed(){if(!C.users.length)for(const [u,p,n,r] of [['wawan','wawan123','Wawan Sismadi','admin'],['dosen','dosen123','Dosen Contoh','dosen'],['reviewer','reviewer123','Reviewer LPPM','reviewer']])await save('users',{id:uid(),username:u,password:p,nama:n,role:r,aktif:1});await seedOpsi()}

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const modal=({t,html='',ok='Simpan',d=0,x=1,chk})=>new Promise(res=>{const m=$('#md');
 m.innerHTML=`<form class="panel" autocomplete="off"><h2 class="ph">${esc(t)}</h2><div class="body"><p class="msg" id="mm" hidden></p>${html}<div class="acts"><button class="btn ${d?'d':'p'}">${esc(ok)}</button>${x?'<button type="button" class="btn" data-x>Batal</button>':''}</div></div></form>`;
 m.hidden=false;const f=m.firstChild,end=v=>{m.hidden=true;m.innerHTML='';m.onkeydown=null;res(v)};
 f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),er=chk&&chk(v);if(er)return note('mm',er);end(v)};

 $('#dr').classList.add('on');$('#scrim').classList.add('on')}

async function adv(id,to){const r=C.proposal.find(x=>x.id===id);r.status=to;r.updated_at=new Date().toISOString();await save('proposal',r);rf(id)}
async function review(id,f){const d=Object.fromEntries(new FormData(f)),sk=+d.skor;if(d.skor===''||isNaN(sk)||sk<0||sk>100)return note('rvm','Isi skor 0–100.');
 await save('review',{id:uid(),proposal_id:id,reviewer_id:U.id,skor:sk,rekomendasi:d.rek,catatan:d.cat,created_at:new Date().toISOString()});rf(id)}
async function layak(id){if(!C.review.some(x=>x.proposal_id===id))return warn('Belum ada review untuk proposal ini.');
 const p=full(id),s=SK[p.skema],T=s.dana?[1.5e6,2e6,2.5e6]:[.25,.35,.4].map(x=>p.anggaran*x);
 for(const x of C.termin.filter(t=>t.proposal_id===id))await rm('termin',x.id);
 for(let n=0;n<3;n++)await save('termin',{id:uid(),proposal_id:id,termin:n+1,persen:T[n]/p.anggaran*100,jumlah:T[n],status:'menunggu',tanggal:''});await adv(id,'kontrak')}
async function cair(tid){const t=C.termin.find(x=>x.id===tid),p=C.proposal.find(x=>x.id===t.proposal_id),need=['kontrak','laporan','luaran'][t.termin-1],to=['pelaksanaan','diseminasi','selesai'][t.termin-1];
 if(p.status!==need)return warn('Syarat termin '+t.termin+' belum terpenuhi: '+TSYARAT[t.termin-1]+'.');
 t.status='dicairkan';t.tanggal=new Date().toISOString().slice(0,10);await save('termin',t);await adv(p.id,to);if(cur=='fund')go('fund')}
async function publ(id){const d=await modal({t:'Lapor bukti publikasi',html:inp('Judul / tautan artikel (bukti publikasi sesuai ketentuan skema)','bukti','','text','required'),ok:'Kirim',chk:x=>x.bukti.trim()?'':'Isi bukti publikasi.'});if(!d)return;const v=d.bukti.trim();
 const r=C.proposal.find(x=>x.id===id),i=JSON.parse(r.isi);i.publikasi=v;r.isi=JSON.stringify(i);await save('proposal',r);await adv(id,'luaran')}
async function hapus(id){if(!await sure('Hapus proposal ini beserta anggota, review, dan termin?'))return;for(const t of ['anggota','review','termin'])for(const x of C[t].filter(y=>y.proposal_id===id))await rm(t,x.id);await rm('proposal',id);go('list')}
function fund(){const t=C.termin.slice().sort((a,b)=>a.proposal_id.localeCompare(b.proposal_id)||a.termin-b.termin);
 return `<div class="tw"><table><thead><tr><th>Proposal</th><th>Termin</th><th>Jumlah</th><th>Syarat</th><th>Status</th></tr></thead><tbody>${t.length?t.map(x=>{const p=C.proposal.find(y=>y.id===x.proposal_id);return `<tr><td>${esc(p?.judul)}</td><td>T${x.termin} (${x.persen.toFixed(0)}%)</td><td>${rp(x.jumlah)}</td><td>${TSYARAT[x.termin-1]}</td><td>${x.status=='menunggu'?`<button class="btn" onclick="cair('${x.id}')">Cairkan</button>`:'Dicairkan '+x.tanggal}</td></tr>`}).join(''):'<tr><td colspan=5>Termin dibuat otomatis saat proposal ditetapkan layak.</td></tr>'}</tbody></table></div>`}

/* ---- Cetak sampul + halaman pengesahan (Lampiran 1 & 2) ---- */
function cetak(id){const p=full(id),s=SK[p.skema],i=p.isi,k=i.ketua,r=(a,b)=>`<tr><td width="35%">${a}</td><td>${b}</td></tr>`;
 $('#pa').innerHTML=`<div style="text-align:center;padding:80px 0;page-break-after:always;font-family:'Times New Roman',serif"><h2>PROPOSAL<br>${s.n.toUpperCase()}<br>UNIVERSITAS IPWIJA</h2><h3 style="margin:60px 0">${esc(p.judul)}</h3><p>PROGRAM STUDI ${esc(k.prodi)}<br>UNIVERSITAS IPWIJA<br>${p.tahun}</p><small>Sampul softcover warna ${s.sampul}, tulisan hitam</small></div>
 <div style="font-family:'Times New Roman',serif"><h3 style="text-align:center">HALAMAN PENGESAHAN<br>${s.n.toUpperCase()}<br>UNIVERSITAS IPWIJA</h3><table style="width:100%;border-collapse:collapse">${r('Judul',esc(p.judul))}${r('Manfaat sosial ekonomi',esc(i.manfaat))}
 ${r('Ketua',`${esc(k.nama)}<br>Jabatan fungsional: ${k.jab||'–'}<br>Program studi: ${esc(k.prodi)}<br>SINTA ID: ${esc(k.sinta)}<br>HP: ${esc(k.hp)} · ${esc(k.email)}`)}${p.ag.map((a,n)=>r('Anggota '+(n+1),`${esc(a.nama)}<br>SINTA ID: ${esc(a.sinta)} · ${esc(a.prodi)}`)).join('')}
 ${r('Jumlah mahasiswa / alumni terlibat',p.jml_mahasiswa+' / '+(i.alumni||0))}${r('Lokasi kegiatan',esc(i.lokasi))}${r('Lama kegiatan',s.dur)}${r('Biaya',rp(p.anggaran))}${r('Sumber dana','Universitas IPWIJA')}</table>
 <p style="margin-top:30px">Jakarta, ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</p><table style="width:100%;border:0"><tr><td style="border:0">Menyetujui,<br>Kepala LPPM Universitas IPWIJA<br><br><br><br>Dr. Ir. Titing Widyastuti, MM.<br>NIDN</td><td style="border:0">Ketua,<br><br><br><br><br>${esc(k.nama)}<br>NIDN</td></tr></table></div>`;window.print()}

/* ---- Basis data: ekspor untuk migrasi ke D1 ---- */
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()};
const sq=v=>v==null?'NULL':typeof v=='number'?v:"'"+String(v).replace(/'/g,"''")+"'";
function dump(){let o='';for(const t of TABLES)for(const r of C[t]){const k=Object.keys(r);o+=`INSERT OR REPLACE INTO ${t}(${k.join(',')}) VALUES(${k.map(x=>sq(r[x])).join(',')});\n`}return o}
function dbv(){return `<p>Penyimpanan aktif: <b>IndexedDB</b> (lokal di browser). Seluruh akses data lewat adapter <code>DB</code> (<code>open/all/put/del</code>); skema SQL di bawah kompatibel SQLite sehingga langsung dapat dipakai di Cloudflare D1.</p>
 <div class="acts"><button class="btn p" onclick="dl('schema.sql',SCHEMA_SQL)">Unduh schema.sql</button><button class="btn" onclick="dl('seed.sql',dump())">Unduh seed.sql (INSERT data)</button><button class="btn" onclick="dl('ppm-backup.json',JSON.stringify(C,null,1))">Ekspor JSON</button><button class="btn d" onclick="reset()">Reset data lokal</button></div>
 <h4>Jumlah baris</h4>${TABLES.map(t=>`<p>${t}: ${C[t].length}</p>`).join('')}<h4>schema.sql</h4><pre style="white-space:pre-wrap;font-size:12px">${esc(SCHEMA_SQL)}</pre>`}
async function reset(){if(!await sure('Hapus SEMUA data lokal? Tindakan ini tidak dapat dibatalkan.'))return;await IDB.reset();location.reload()}

/* ===== 4b. Master data (opsi), kelola pengguna, profil ===== */
const ROLE={admin:['Admin LPPM','#2a5a8c'],dosen:['Dosen','#2a7f62'],reviewer:['Reviewer','#b7791f']};
const PRODI0=['Teknik Informatika','Teknik Sipil','Teknik Industri','Teknik Elektro','Manajemen'];
const KAT={prodi:['Program Studi','Dipakai pada profil pengguna, program studi ketua, dan anggota proposal.'],semester:['Semester','Pilihan semester pada form proposal.'],tahun:['Tahun Usulan','Pilihan tahun pada form proposal.']};
let mk='prodi';
const ord=k=>C.opsi.filter(o=>o.kategori===k).sort((a,b)=>a.urut-b.urut||a.nilai.localeCompare(b.nilai));
const opts=(k,cur)=>{const l=ord(k).filter(o=>o.aktif!==0).map(o=>o.nilai),c=cur==null?'':String(cur);if(c&&!l.includes(c))l.push(c);return l};
const osel=(n,k,v,blank)=>`<select name="${n}">${blank?`<option value="">${blank}</option>`:''}${opts(k,v).map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
const fs=(n,o,v)=>`<select name="${n}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
const note=(id,t,ok)=>{const m=$('#'+id);m.textContent=t;m.className='msg'+(ok?' ok':'');m.hidden=false;m.scrollIntoView({block:'center'})};
const paintSess=()=>{$('#sess').innerHTML=`<span class="wl">Selamat datang </span><b>${esc(U.nama)}</b> (${U.role}) | <a href="#" onclick="go('profil');return false">Profil</a> | <a href="#" onclick="logout();return false">Log Out</a>`};
const iso=p=>JSON.parse(p.isi||'{}');
const setI=async(p,f)=>{const i=iso(p);f(i);p.isi=JSON.stringify(i);await save('proposal',p)};
/* REF: n(nilai)=jumlah data yang memakai opsi; r(lama,baru)=ganti nama di semua data terkait */
const REF={
 prodi:{n:v=>C.users.filter(u=>u.prodi===v).length+C.anggota.filter(a=>a.prodi===v).length+C.proposal.filter(p=>iso(p).ketua?.prodi===v).length,
  async r(a,b){for(const u of C.users.filter(u=>u.prodi===a))await save('users',{...u,prodi:b});for(const x of C.anggota.filter(x=>x.prodi===a))await save('anggota',{...x,prodi:b});
   for(const p of C.proposal.filter(p=>iso(p).ketua?.prodi===a))await setI(p,i=>i.ketua.prodi=b)}},
 semester:{n:v=>C.proposal.filter(p=>p.semester===v).length,async r(a,b){for(const p of C.proposal.filter(p=>p.semester===a)){p.semester=b;await save('proposal',p)}}},
 tahun:{n:v=>C.proposal.filter(p=>String(p.tahun)===v).length,async r(a,b){for(const p of C.proposal.filter(p=>String(p.tahun)===a)){p.tahun=+b;await save('proposal',p)}}}};
async function seedOpsi(){if(C.opsi.length)return;
 const uq=a=>[...new Set(a.map(x=>String(x??'').trim()).filter(Boolean))];
 const D={prodi:uq([...PRODI0,...C.users.map(u=>u.prodi),...C.anggota.map(a=>a.prodi),...C.proposal.map(p=>iso(p).ketua?.prodi)]),semester:['Ganjil','Genap'],
  tahun:uq(['2025','2026','2027','2028',...C.proposal.map(p=>p.tahun)]).sort()};
 for(const [k,l] of Object.entries(D))for(const [i,v] of l.entries())await save('opsi',{id:uid(),kategori:k,nilai:v,urut:i,aktif:1})}

/* ---- Master data & opsi (admin) ---- */
function master(){const l=ord(mk);
 return `<div class="bar"><select onchange="mk=this.value;go('master')">${Object.entries(KAT).map(([k,v])=>`<option value="${k}" ${k==mk?'selected':''}>${v[0]}</option>`).join('')}</select><span>${esc(KAT[mk][1])}</span></div>
 <p class="msg" id="om" hidden></p><form class="bar" onsubmit="event.preventDefault();addOpsi()"><input id="nv" placeholder="Nilai baru…" required><button class="btn p">+ Tambah</button><span>Jumlah: ${l.length}</span></form>
 <div class="tw"><table><thead><tr><th>#</th><th>Nilai</th><th>Dipakai</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${l.length?l.map((o,i)=>`<tr class="${o.aktif===0?'off':''}"><td>${i+1}</td><td>${esc(o.nilai)}</td><td>${REF[mk].n(o.nilai)}</td><td>${o.aktif===0?'Nonaktif':'Aktif'}</td>
 <td class="act"><button class="btn sm" ${i?'':'disabled'} onclick="geser('${o.id}',-1)">↑</button> <button class="btn sm" ${i<l.length-1?'':'disabled'} onclick="geser('${o.id}',1)">↓</button> <button class="btn sm" onclick="ubahOpsi('${o.id}')">Ubah</button> <button class="btn sm" onclick="togOpsi('${o.id}')">${o.aktif===0?'Aktifkan':'Nonaktifkan'}</button> <button class="btn sm d" onclick="hapusOpsi('${o.id}')">Hapus</button></td></tr>`).join(''):'<tr><td colspan=5>Belum ada opsi.</td></tr>'}</tbody></table></div>
 <p><small>Opsi nonaktif tidak muncul di form, tetapi data lama yang memakainya tetap utuh. Opsi yang masih dipakai tidak dapat dihapus. Mengubah nama otomatis memperbarui semua data terkait.</small></p>`}
const badOpsi=(v,id)=>mk==='tahun'&&!/^\d{4}$/.test(v)?'Tahun harus 4 digit angka.':ord(mk).some(o=>o.id!==id&&o.nilai.toLowerCase()===v.toLowerCase())?'Nilai sudah ada.':'';
async function addOpsi(){const v=$('#nv').value.trim();if(!v)return;const e=badOpsi(v);if(e)return note('om',e);
 const l=ord(mk);await save('opsi',{id:uid(),kategori:mk,nilai:v,urut:l.length?Math.max(...l.map(o=>o.urut))+1:0,aktif:1});go('master')}
async function ubahOpsi(id){const o=C.opsi.find(x=>x.id===id),d=await modal({t:'Ubah nilai',html:inp('Nilai','v',o.nilai,'text','required'),chk:x=>badOpsi(x.v.trim(),id)});if(!d)return;const v=d.v.trim();if(v===o.nilai)return;
 const n=REF[mk].n(o.nilai);if(n&&!await sure(`Nilai ini dipakai pada ${n} data. Semua akan diperbarui ke "${v}". Lanjutkan?`))return;
 await REF[mk].r(o.nilai,v);o.nilai=v;await save('opsi',o);U=C.users.find(x=>x.id===U.id);paintSess();go('master')}
async function togOpsi(id){const o=C.opsi.find(x=>x.id===id);o.aktif=o.aktif===0?1:0;await save('opsi',o);go('master')}
async function hapusOpsi(id){const o=C.opsi.find(x=>x.id===id),n=REF[mk].n(o.nilai);
 if(n)return warn(`Opsi ini masih dipakai pada ${n} data. Nonaktifkan saja agar tidak muncul di form.`);if(!await sure('Hapus opsi "'+o.nilai+'"?'))return;await rm('opsi',id);go('master')}
async function geser(id,d){const l=ord(mk),i=l.findIndex(o=>o.id===id),j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];
 for(let n=0;n<l.length;n++)if(l[n].urut!==n){l[n].urut=n;await save('opsi',l[n])}go('master')}

/* ---- Profil & kelola pengguna ---- */
const pfields=(u,c='g3')=>`<div class="${c}">${inp('Nama lengkap','nama',u.nama)}${inp('Email','email',u.email,'email')}${inp('No. HP','hp',u.hp)}${inp('NIDN','nidn',u.nidn)}${inp('SINTA ID','sinta',u.sinta)}<div class="fg"><label>Pendidikan terakhir</label>${fs('pend',['','S1','S2','S3'],u.pend)}</div><div class="fg"><label>Jabatan fungsional</label>${fs('jab',JAB,u.jab)}</div><div class="fg"><label>Program studi</label>${osel('prodi','prodi',u.prodi,'— pilih —')}</div></div>`;
const pdata=(f,g=k=>(f.get(k)||'').trim())=>({nama:g('nama'),email:g('email'),hp:g('hp'),nidn:g('nidn'),sinta:g('sinta'),pend:g('pend'),jab:g('jab'),prodi:g('prodi')});
function profil(){return `<form id="pf" onsubmit="return false"><p class="msg" id="pm" hidden></p>
 <fieldset><legend>Akun</legend><div class="g3">${inp('Username','un',U.username,'text','readonly')}${inp('Role','ro',ROLE[U.role][0],'text','readonly')}</div></fieldset>
 <fieldset><legend>Data diri</legend>${pfields(U)}<small>Data ini mengisi otomatis identitas ketua saat membuat proposal baru.</small></fieldset>
 <div class="acts"><button class="btn p" onclick="svProfil()">Simpan profil</button></div></form>
 <form id="pw" onsubmit="return false" autocomplete="off" style="margin-top:18px"><p class="msg" id="pwm" hidden></p>
 <fieldset><legend>Ubah password</legend><div class="g3">${inp('Password lama','po','','password','autocomplete="current-password"')}${inp('Password baru (min. 6 karakter)','pn','','password','autocomplete="new-password"')}${inp('Ulangi password baru','pc','','password','autocomplete="new-password"')}</div></fieldset>
 <div class="acts"><button class="btn" onclick="svPw()">Ubah password</button></div></form>`}
async function svProfil(){const d=pdata(new FormData($('#pf')));if(!d.nama)return note('pm','Nama wajib diisi.');
 const r={...U,...d};await save('users',r);await syncAng(r);U=r;paintSess();note('pm','Profil tersimpan.',1)}
async function svPw(){const f=new FormData($('#pw')),o=f.get('po'),n=f.get('pn'),c=f.get('pc');
 if(o!==U.password)return note('pwm','Password lama salah.');if(!n||n.length<6)return note('pwm','Password baru minimal 6 karakter.');if(n!==c)return note('pwm','Konfirmasi password tidak sama.');
 const r={...U,password:n};await save('users',r);U=r;$('#pw').reset();note('pwm','Password diperbarui.',1)}

const admins=ex=>C.users.filter(u=>u.role==='admin'&&u.aktif!==0&&u.id!==ex).length;
function users(){const f=(q.u||'').toLowerCase(),r=q.ur||'',v=C.users.filter(u=>(!r||u.role===r)&&(!f||(u.username+' '+u.nama+' '+(u.email||'')).toLowerCase().includes(f)));
 return `<form class="bar" onsubmit="return false"><input placeholder="Cari username / nama / email…" value="${esc(q.u||'')}" oninput="q.u=this.value;ru()"><select onchange="q.ur=this.value;ru()"><option value="">Semua role</option>${Object.entries(ROLE).map(([k,s])=>`<option value="${k}" ${r==k?'selected':''}>${s[0]}</option>`).join('')}</select><button class="btn p" onclick="uform()">+ Tambah pengguna</button><span>Jumlah: ${v.length}</span></form>
 <div class="tw"><table><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Program studi</th><th>Email</th><th>Status</th></tr></thead><tbody>${v.length?v.map(u=>`<tr data-id="${u.id}" class="${u.aktif===0?'off':''}" onclick="uform('${u.id}')"><td>${esc(u.username)}</td><td>${esc(u.nama)}</td><td>${chip(ROLE,u.role)}</td><td>${esc(u.prodi)}</td><td>${esc(u.email)}</td><td>${u.aktif===0?'Nonaktif':'Aktif'}</td></tr>`).join(''):'<tr><td colspan=6>Tidak ada pengguna.</td></tr>'}</tbody></table></div>`}
function uform(id){const u=id?C.users.find(x=>x.id===id):{role:'dosen',aktif:1};$('#dt').textContent=id?'Ubah Pengguna':'Tambah Pengguna';
 $('#db').innerHTML=`<form id="uf" onsubmit="return false" autocomplete="off"><p class="msg" id="um" hidden></p>
 <div class="g2">${inp('Username','username',u.username,'text',id?'readonly':'autocomplete="off"')}<div class="fg"><label>Role</label><select name="role">${Object.entries(ROLE).map(([k,s])=>`<option value="${k}" ${k==u.role?'selected':''}>${s[0]}</option>`).join('')}</select></div></div>
 ${inp(id?'Password baru (kosongkan jika tidak diubah)':'Password awal (min. 6 karakter)','password','','password','autocomplete="new-password"')}
 ${pfields(u,'g2')}
 <div class="fg"><label><input type="checkbox" name="aktif" ${u.aktif===0?'':'checked'} style="width:auto"> Akun aktif (boleh login)</label></div>
 <div class="acts"><button class="btn p" onclick="svUser(${id?`'${id}'`:'null'})">Simpan</button>${id?`<button class="btn d" onclick="hapusUser('${id}')">Hapus</button>`:''}</div></form>`;
 $('#dr').classList.add('on');$('#scrim').classList.add('on')}
async function svUser(id){const f=new FormData($('#uf')),old=id&&C.users.find(x=>x.id===id),un=(f.get('username')||'').trim().toLowerCase(),pw=f.get('password')||'',role=f.get('role'),aktif=f.get('aktif')?1:0,d=pdata(f);
 if(!/^[a-z0-9._-]{3,30}$/.test(un))return note('um','Username 3–30 karakter: huruf kecil, angka, titik, garis bawah, atau strip.');
 if(C.users.some(x=>x.username===un&&x.id!==id))return note('um','Username sudah dipakai.');
 if(!d.nama)return note('um','Nama wajib diisi.');
 if(!id&&pw.length<6)return note('um','Password awal minimal 6 karakter.');if(id&&pw&&pw.length<6)return note('um','Password baru minimal 6 karakter.');
 if(old){if(id===U.id&&(role!==U.role||!aktif))return note('um','Anda tidak dapat mengubah role atau menonaktifkan akun Anda sendiri.');
  if(old.role==='admin'&&(role!=='admin'||!aktif)&&!admins(id))return note('um','Harus ada minimal satu admin aktif.')}
 const r={...(old||{id:uid()}),username:un,role,aktif,...d,password:pw||old?.password};await save('users',r);await syncAng(r);
 if(r.id===U.id){U=r;paintSess()}closeDr();go('users')}
async function hapusUser(id){const u=C.users.find(x=>x.id===id);if(id===U.id)return warn('Anda tidak dapat menghapus akun sendiri.');
 if(u.role==='admin'&&!admins(id))return warn('Harus ada minimal satu admin aktif.');
 const np=C.proposal.filter(p=>p.ketua_id===id).length,nr=C.review.filter(r=>r.reviewer_id===id).length,na=C.anggota.filter(a=>a.user_id===id).length;
 if(np||nr||na)return warn(`Pengguna ini terkait dengan ${np} proposal (ketua), ${na} keanggotaan tim, dan ${nr} review. Nonaktifkan akun saja agar data tetap utuh.`);
 if(!await sure('Hapus pengguna "'+u.username+'"?'))return;await rm('users',id);closeDr();go('users')}

/* ===== 5. Login & init ===== */
function start(u){U=u;localStorage.setItem('ppm_u',u.username);$('#auth').hidden=true;paintSess();go('home')}
function logout(){localStorage.removeItem('ppm_u');U=null;$('#auth').hidden=false}
$('#lf').onsubmit=e=>{e.preventDefault();const u=C.users.find(x=>x.username==$('#lu').value.trim().toLowerCase()&&x.password==$('#lp').value);
 if(!u){return note('le','Username atau password salah.')}if(u.aktif===0)return note('le','Akun dinonaktifkan. Hubungi admin LPPM.');$('#le').hidden=true;start(u)};
(async()=>{await DB.open();await load();await seed();const u=C.users.find(x=>x.username==localStorage.getItem('ppm_u')&&x.aktif!==0);if(u)start(u)})();
</script></body></html>
